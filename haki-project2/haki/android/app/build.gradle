plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.haki.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.haki.pos'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Адрес сервера можно зашить при сборке: gradle assembleDebug -PhakiUrl=https://haki-xxxx.onrender.com
        // Если не задан, приложение спросит адрес при первом запуске.
        def url = project.findProperty('hakiUrl') ?: ''
        buildConfigField 'String', 'DEFAULT_URL', "\"${url}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
