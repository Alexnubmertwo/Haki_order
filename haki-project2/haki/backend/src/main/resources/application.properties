spring.application.name=Haki
# na hostinge port zadayotsya peremennoy PORT
server.port=${PORT:8080}

# JSON: LocalDateTime kak ISO-stroka
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Supabase (PostgreSQL) ----
# Znacheniya berutsya iz peremennyh okruzheniya, v kode paroley net.
# Supabase -> Project Settings -> Database -> Connection string -> JDBC (Session pooler, port 5432):
#   SUPABASE_DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   SUPABASE_DB_USER=postgres.<project-ref>
#   SUPABASE_DB_PASSWORD=<parol bazy>
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# ---- Superadmin (sozdayotsya pri pervom zapuske, esli v baze eshchyo net superadmina) ----
haki.superadmin.user=${HAKI_SUPERADMIN_USER:}
haki.superadmin.password=${HAKI_SUPERADMIN_PASSWORD:}
# srok jizni vhoda v chasah
haki.session.hours=24
