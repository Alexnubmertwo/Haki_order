spring.application.name=Haki
# na hostinge port zadayotsya peremennoy PORT
server.port=${PORT:8080}

# JSON: LocalDateTime kak ISO-stroka
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Skorost' ----
# Szhatie otvetov (app.js ~45 KB -> ~12 KB) - zametno na mobil'nom internete
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json
# Staticheskie fayly kesh brauzera na 5 minut (potom proverka)
spring.web.resources.cache.cachecontrol.max-age=5m
spring.web.resources.cache.cachecontrol.must-revalidate=true

# ---- Supabase (PostgreSQL) ----
# Znacheniya berutsya iz peremennyh okruzheniya, v kode paroley net.
# Supabase -> Project Settings -> Database -> Connection string -> JDBC (Session pooler, port 5432):
#   SUPABASE_DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   SUPABASE_DB_USER=postgres.<project-ref>
#   SUPABASE_DB_PASSWORD=<parol bazy>
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Pul soedineniy: derzhim gotovye soedineniya i "budim" ih, chtoby pervyy zapros posle pauzy ne zhdal novogo podklyucheniya
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.connection-timeout=15000
# pachki insert'ov odnim zaprosom (checkout)
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# ---- Superadmin (sozdayotsya pri pervom zapuske, esli v baze eshchyo net superadmina) ----
haki.superadmin.user=${HAKI_SUPERADMIN_USER:}
haki.superadmin.password=${HAKI_SUPERADMIN_PASSWORD:}
# srok jizni vhoda v chasah
haki.session.hours=24
